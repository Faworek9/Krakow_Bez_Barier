version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krakow_bez_barier_backend
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krakow_bez_barier_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
